# nginx inside the teamnmakeovers-web container. Not the host's: on the VPS
# only TeamN's Caddy listens on 80/443; it does TLS and gzip and forwards here.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    etag on;

    # Vite puts a content hash in every file name under /assets/, so a new
    # build gets new names and these can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # React Router (BrowserRouter): a refresh on any page must get index.html.
        try_files $uri $uri/ /index.html;
    }
}
